<div class="tool-container">
  <div class="text-container">
    <strong>{{ item?.Desc }}</strong>
    <strong>{{ item?.Percent + "%" }}</strong>
  </div>
  <div class="progress">
    <mat-progress-bar
      [ngStyle]="{'--mdc-linear-progress-active-indicator-color': getColor(item?.Percent ?? 0)}"
      mode="determinate"
      [value]="item?.Percent"
    />
  </div>
</div>
