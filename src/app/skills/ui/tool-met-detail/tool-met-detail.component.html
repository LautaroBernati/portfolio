<div class="tool-container">
  <div class="text-container">
    <strong>{{ item?.Desc }}</strong>
    <strong>{{ item?.Percent + '%' }}</strong>
  </div>
  <div class="progress">
    <mat-progress-bar
      [ngStyle]="{
        '--mat-progress-bar-active-indicator-color': getColor(
          item?.Percent ?? 0
        ),
      }"
      mode="determinate"
      [value]="$safeNavigationMigration(item?.Percent)"
    />
  </div>
</div>
